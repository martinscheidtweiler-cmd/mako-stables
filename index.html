function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monday(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}

function isAway(rider,day){return absences.some(a=>a.rider_name===rider&&a.day===day)}
function isJump(a){return /spring|gymnast|hindernis|parcours|jump|kruisje/i.test(String(a||''))}

 const current=absences.filter(a=>a.day===day);
 sheet('<div class="row between"><h2>Beschikbaarheid</h2><button class="iconbtn" data-close>×</button></div><p class="minor">'+e(pretty(day))+' · Duid aan wie die dag niet kan rijden. Dit geldt voor jullie beiden en voor de AI-planner.</p><form id="absenceForm">'+input('Datum','day',day,'date')+['Martin','Kobe'].map(name=>'<label class="checkline" style="margin-top:19px"><input type="checkbox" name="away_'+name+'" '+(current.some(a=>a.rider_name===name)?'checked':'')+'> '+name+' is afwezig</label>').join('')+input('Extra opmerking (optioneel)','note',current[0]?.note||'','textarea')+'<p class="status">Als één ruiter alleen is, plant de AI maximaal twee werktrainingen voor die dag. Rust is ook een optie.</p><p id="absenceError" class="error"></p><button class="btn full" style="margin-top:14px">Beschikbaarheid opslaan</button></form>');
 document.getElementById('absenceForm').onsubmit=async ev=>{

function validateTrainingDay(horseId,day,rider,activity,ignoreId=null){
 if(isAway(rider,day)&&!isRest(activity))throw Error(rider+' is op '+day+' afwezig.');
 if(sessions.some(s=>s.id!==ignoreId&&s.horse_id===horseId&&s.day===day))throw Error('Dit paard heeft al een training op '+day+'.');
 const mondayDay=monday(new Date(day+'T12:00:00'));
 const weekEnd=addDay(iso(mondayDay),6);
 if(isJump(activity)&&sessions.some(s=>s.id!==ignoreId&&s.horse_id===horseId&&s.day>=iso(mondayDay)&&s.day<=weekEnd&&isJump(s.activity)&&s.status!=='skipped'))throw Error('Dit paard springt of doet al gymnastiek in deze week.');
 if(!isRest(activity)&&sessions.filter(s=>s.id!==ignoreId&&s.day===day&&s.rider_name===rider&&!isRest(s.activity)&&s.status!=='skipped').length>=2)throw Error(rider+' heeft die dag al twee werktrainingen.');
}

async function saveOriginalVideo(file,horseId){
 const mime=file.type==='video/quicktime'?'video/quicktime':file.type==='video/webm'?'video/webm':'video/mp4';
 const ext=mime==='video/webm'?'webm':mime==='video/quicktime'?'mov':'mp4';
 const path=work.id+'/'+crypto.randomUUID()+'.'+ext;
 const saved=await supa.storage.from('mako-training-videos').upload(path,file,{contentType:mime,cacheControl:'3600',upsert:false});
 if(saved.error)throw saved.error;
 const dbRow=await supa.from('htp_videos').insert({workspace_id:work.id,horse_id:horseId,file_name:file.name,storage_path:path,size_bytes:file.size,uploaded_by:authUser.id});
 if(dbRow.error){await supa.storage.from('mako-training-videos').remove([path]);throw dbRow.error}
}
async function makeFrames(file,count=5){
 const blob=URL.createObjectURL(file),video=document.createElement('video');video.preload='auto';video.muted=true;video.playsInline=true;video.src=blob;
 try{
  await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=()=>reject(new Error('Kan dit videoformaat niet openen op je telefoon. Probeer een MP4.'));setTimeout(()=>reject(new Error('Video inladen duurt te lang.')),15000)});
  if(!Number.isFinite(video.duration)||video.duration<.5)throw Error('Dit filmpje heeft geen bruikbare lengte.');
  const frames=[];const duration=Math.min(video.duration,600);
  for(let i=0;i<count;i++){
   let t=duration*(.1+.8*i/(count-1));
   await new Promise((resolve,reject)=>{let timeout=setTimeout(()=>reject(new Error('Kon videobeelden niet verwerken.')),11000);video.onseeked=()=>{clearTimeout(timeout);resolve()};video.currentTime=Math.max(0,Math.min(video.duration-.05,t))});
   const canvas=document.createElement('canvas'),scale=Math.min(1,640/Math.max(video.videoWidth||640,video.videoHeight||360));
   canvas.width=Math.max(16,Math.round((video.videoWidth||640)*scale));canvas.height=Math.max(16,Math.round((video.videoHeight||360)*scale));
   canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
   frames.push(canvas.toDataURL('image/jpeg',.55));
  }
  return frames;
 } finally {video.src='';URL.revokeObjectURL(blob)}
}

function planDetail(id){const p=aiPlans.find(x=>x.id===id);if(!p)return;const list=(p.proposal?.sessions||[]).map(x=>({...x}));const horseName=id=>horses.find(h=>h.id===id)?.name||'Paard';

 document.getElementById('applyPlan').onclick=async()=>{
  const btn=document.getElementById('applyPlan');btn.disabled=true;

   const seen=new Set();for(const t of list){if(!['Martin','Kobe'].includes(t.rider_name)||!/^\d{4}-\d{2}-\d{2}$/.test(t.day))throw Error('Controleer de datum en ruiter.');const k=t.horse_id+'_'+t.day;if(seen.has(k))throw Error('Dubbele training voor hetzelfde paard en dezelfde dag.');seen.add(k)}

async function saveSession(s,field,val){if(['day','rider_name','activity'].includes(field)){try{validateTrainingDay(s.horse_id,field==='day'?val:s.day,field==='rider_name'?val:s.rider_name,field==='activity'?val:s.activity,s.id)}catch(ex){return problem(ex)}}const patch={[field]:field==='duration_min'?Number(val)||null:val,updated_at:new Date().toISOString()};const r=await supa.from('htp_sessions').update(patch).eq('id',s.id).eq('workspace_id',work.id);if(r.error)return problem(r.error);Object.assign(s,patch);await reload();toast('Opgeslagen')}
async function saveTask(t,patch){const r=await supa.from('htp_exercises').update(patch).eq('id',t.id).eq('workspace_id',work.id);if(r.error)return problem(r.error);Object.assign(t,patch);toast('Opgeslagen')}
function editSession(id){const s=sessions.find(s=>s.id===id);if(!s)return;const h=horses.find(h=>h.id===s.horse_id),tt=tasks.filter(t=>t.session_id===id);let html='<div class="row between"><div><div class="eyebrow">'+e(h?.name)+'</div><h2>'+e(s.activity)+'</h2></div><button class="iconbtn" data-close>×</button></div><div class="two">'+input('Datum','day',s.day,'date')+select('Ruiter','rider_name',s.rider_name,['Martin','Kobe'])+'</div>'+select('Type','activity',s.activity,['Basiswerk','Dressuur','Balkjes','Gymnastiek','Springen','Buitenrit','Conditie','Rust'])+input('Minuten','duration_min',s.duration_min,'number')+input('Concreet trainingsdoel','goal',s.goal,'textarea')+'<div class="section">Oefeningen · gewoon afvinken</div>';
 html+=tt.map(t=>'<div class="task"><div class="row"><input class="check" type="checkbox" data-check="'+t.id+'" '+(t.completed?'checked':'')+'><div class="grow"><div class="bold">'+e(t.title)+'</div><div class="fine">'+e(t.detail||'')+'</div></div><button class="link" data-del-task="'+t.id+'">×</button></div><div class="two" style="margin-top:11px"><select data-feedback="'+t.id+'"><option value="">Optioneel: hoe ging het?</option>'+['Goed','Matig','Moeilijk'].map(x=>'<option value="'+x+'" '+(t.feedback===x?'selected':'')+'>'+x+'</option>').join('')+'</select><input placeholder="Bijv. valt naar binnen" data-note="'+t.id+'" value="'+e(t.comment||'')+'"></div></div>').join('');
 html+='<div class="box"><form id="taskForm"><b>+ Oefening toevoegen</b><input name="title" placeholder="10 overgangen stap ↔ draf" required style="margin:9px 0"><input name="detail" placeholder="Extra uitleg (optioneel)"><button class="btn alt full" style="margin-top:9px">Toevoegen</button></form></div>'+input('Algemene opmerking','comment',s.comment,'textarea')+select('Trainingstatus','status',s.status,['planned','done','skipped'])+'<div class="two" style="margin-top:20px"><button class="btn" data-close>Gereed</button><button class="btn danger" id="removeSession">Verwijderen</button></div>';
 sheet(html);modal.querySelectorAll('[name="day"],[name="rider_name"],[name="activity"],[name="duration_min"],[name="goal"],[name="comment"],[name="status"]').forEach(x=>x.onchange=()=>saveSession(s,x.name,x.value));modal.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>saveTask(tasks.find(t=>t.id===x.dataset.check),{completed:x.checked}));modal.querySelectorAll('[data-feedback]').forEach(x=>x.onchange=()=>saveTask(tasks.find(t=>t.id===x.dataset.feedback),{feedback:x.value||null}));modal.querySelectorAll('[data-note]').forEach(x=>x.onchange=()=>saveTask(tasks.find(t=>t.id===x.dataset.note),{comment:x.value}));modal.querySelectorAll('[data-del-task]').forEach(x=>x.onclick=async()=>{if(!confirm('Oefening verwijderen?'))return;const r=await supa.from('htp_exercises').delete().eq('id',x.dataset.delTask);if(r.error)return problem(r.error);await reload();editSession(id)});document.getElementById('taskForm').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));if(!f.title.trim())return;const r=await supa.from('htp_exercises').insert({workspace_id:work.id,session_id:id,title:f.title.trim(),detail:f.detail,position:tt.length});if(r.error)return problem(r.error);await reload();editSession(id)};document.getElementById('removeSession').onclick=async()=>{if(!confirm('Deze training verwijderen?'))return;const r=await supa.from('htp_sessions').delete().eq('id',id);if(r.error)return problem(r.error);close();await reload()}}
function horseDetail(id){const h=horses.find(x=>x.id===id),list=sessions.filter(x=>x.horse_id===id).sort((a,b)=>b.day.localeCompare(a.day));sheet('<div class="row between"><h2>'+e(h.name)+'</h2><button class="iconbtn" data-close>×</button></div><p class="minor">'+e(h.age_years)+' jaar · '+e(h.profile)+'</p><div class="section">Trainingshistoriek</div>'+list.map(s=>'<button class="box card" data-history="'+s.id+'"><b>'+e(pretty(s.day))+'</b><p class="fine">'+e(s.activity)+' · '+e(s.rider_name)+' · '+statuses[s.status]+'</p></button>').join('')+'<button class="btn full" data-close>Sluiten</button>');modal.querySelectorAll('[data-history]').forEach(x=>x.onclick=()=>editSession(x.dataset.history))}
async function settings(){let iv=[];const owner=authUser.id===work.owner_id;if(owner){const x=await supa.from('htp_invites').select('*').eq('workspace_id',work.id);if(!x.error)iv=x.data||[]}sheet('<div class="row between"><h2>Instellingen</h2><button class="iconbtn" data-close>×</button></div><div class="box"><b>Ruiters</b>'+members.map(m=>'<p class="minor">✓ '+e(m.rider_name)+'</p>').join('')+'</div>'+(owner?'<div class="box"><b>Nodig Kobe uit</b><p class="minor">Vul zijn e-mailadres in. Hij kan daarna met dat adres een account aanmaken.</p><form id="invite"><input name="email" type="email" placeholder="E-mailadres Kobe" required><button class="btn full" style="margin-top:10px">Uitnodigen</button></form>'+iv.map(x=>'<p class="minor">Uitgenodigd: '+e(x.email)+'</p>').join('')+'</div>':'')+'<p class="minor">Gegevens worden veilig opgeslagen in de bestaande Optimus Supabase.</p><button class="btn alt full" id="update">↻ Planning verversen</button><button class="link full" id="logout">Uitloggen</button>');if(owner)document.getElementById('invite').onsubmit=async ev=>{ev.preventDefault();const email=String(new FormData(ev.target).get('email')).trim().toLowerCase();const r=await supa.from('htp_invites').upsert({workspace_id:work.id,email,rider_name:'Kobe'},{onConflict:'workspace_id,email'});if(r.error)return problem(r.error);toast('Uitnodiging opgeslagen; Kobe kan registreren');close()};document.getElementById('update').onclick=async()=>{close();await reload();toast('Bijgewerkt')};document.getElementById('logout').onclick=async()=>{await supa.auth.signOut();work=null;close();login()}}
supa.auth.onAuthStateChange(event=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(boot,0)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&work)reload().catch(problem)});setInterval(()=>{if(!document.hidden&&work&&!modal.innerHTML)reload().catch(()=>{})},45000);boot();
if ('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')) {
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
}
</script></body></html>
